name: Fundscore

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and run fundscore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: fundscore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fundscore/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Score the repo (Markdown)
        run: node bin/fundscore.js .. --md > fundscore-report.md

      - name: Score the repo (JSON)
        run: node bin/fundscore.js .. --json > fundscore-report.json

      - name: Post PR comment with Markdown report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('fundscore/fundscore-report.md', 'utf8');
            const marker = '<!-- fundscore-report -->';
            const body = `${marker}\n${report}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload JSON report artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: fundscore-report
          path: fundscore/fundscore-report.json
          if-no-files-found: error
          retention-days: 30
