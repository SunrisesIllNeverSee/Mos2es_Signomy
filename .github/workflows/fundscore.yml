name: Fundscore

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Lint and test fundscore
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fundscore

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fundscore/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
