standard:
  name: ello-repo-standard
  version: "1.0.0"
  mode: migrate

repo:
  name: Mos2es_Signomy
  type: website
  lifecycle: active
  repo_id: mos2es_signomy
  family: moses
  purpose: Mos2es_Signomy — MO§ES™/CIVITAE governance infrastructure, live at signomy.xyz. 4 patents + trademark.

structure:
  profile: website
  allowed_root_dirs_extra: [fundscore, system-devin]
  allowed_root_files_extra: [.fundscore.yml, architecture.html, index.html, COMP-SCORE.md, COMPARABLES.md, CONSERVATION-LAW.md, DEEP_WIKI.md, FUNDING-REPORT.md, FUNDING.md, GRATA-EXAMPLE.md, MOSES.md, ONE-PAGER.md, PROBLEMS.md, SIGNOMY.md, START-HERE.md, TALKING-POINTS.md, THE-MEDIATOR.md]
  document_roots: [docs]
  artifact_roots: [artifacts]
  archive_roots: [archive, docs/archive]

naming:
  forbid_version_suffixes: true
  forbidden_suffixes: [_final, _final2, _new, _updated, _revised, _copy]

knowledge:
  okf_enabled: true
  okf_roots: [docs, .coord]
  okf_severity: warn

coordination:
  micro_enabled: true
  micro_root: .coord/micro
  macro_enabled: true
  macro_root: .coord/macro

github:
  ruleset_profile: solo-fast
  required_check: repo-standard
